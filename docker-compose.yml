version: '3.8'
services:
  app: 
    build: 
      context: ./docker/php
    container_name: lamp_app
    ports: 
      - '8081:80'
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - wpsite
  
  db:
    image: mysql:latest
    volumes: 
      - db_data:/var/lib/mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE}
      MYSQL_USER: ${USER}
      MYSQL_PASSWORD: ${PASSWORD}
    networks:
      - wpsite
  
  phpmyadmin: 
    depends_on:
      - db
    image: phpmyadmin/phpmyadmin
    restart: always
    ports:
      - '8082:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${ROOT_PASSWORD}
    networks:
      - wpsite
  
  wordpress:
    depends_on:
      - db
    image: wordpress:latest
    ports:
      - '8080:80'
    restart: always
    volumes: 
      - ./wordpress:/var/www/html
    environment:
      WORDPRESS_DB_HOST: ${DB_HOST}
      WORDPRESS_DB_USER: ${USER}
      WORDPRESS_DB_PASSWORD: ${PASSWORD}
      WORDPRESS_DB_NAME: ${DATABASE}
    networks:
      - wpsite

networks:
  wpsite:

volumes:
  db_data:
  
